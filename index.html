/* ===== Render ===== */
let lang = "es", mode = null;
try { lang = localStorage.getItem("vm_lang") || (navigator.language || "es").slice(0, 2); } catch (e) {}
if (!["es", "en", "pt"].includes(lang)) lang = "en";
try { mode = localStorage.getItem("vm_mode"); } catch (e) {}

const tr = v => (typeof v === "string" ? v : v[lang] || v.es);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function itemHTML(it) {
  const a = [];
  if (it.map) a.push(`<a class="btn" href="${maps(it.map)}" target="_blank" rel="noopener">${tr(T.directions)}</a>`);
  if (it.nearby) a.push(`<a class="btn" href="https://www.google.com/maps/search/${encodeURIComponent(it.nearby)}/" target="_blank" rel="noopener">📍 ${tr(T.more)}</a>`);
  if (it.link) a.push(`<a class="btn alt" href="${it.link}" target="_blank" rel="noopener">${tr(T.more)} ↗</a>`);
  (it.tels || []).forEach(n => a.push(`<a class="btn alt" href="tel:${n}">📞 ${n}</a>`));
  (it.phones || []).forEach(([n, p]) => a.push(`<a class="btn alt" href="tel:+54${p}">📞 ${esc(n)}</a>`));
  return `<article class="item${it.fav ? " fav" : ""}">
    ${it.fav ? `<span class="badge">${tr(T.fav)}</span>` : ""}
    <h3>${esc(tr(it.name))}</h3>
    ${it.meta ? `<div class="meta">${esc(it.meta)}</div>` : ""}
    <p>${esc(tr(it.d))}</p>
    ${a.length ? `<div class="actions">${a.join("")}</div>` : ""}
  </article>`;
}

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = tr(T[el.dataset.t]));
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.querySelectorAll(".mode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  document.getElementById("modeNote").textContent = mode ? tr(mode === "work" ? T.noteWork : T.noteFun) : "";

  // Botones grandes: los del modo elegido van primero y resaltados
  const visible = S.filter(s => !s.onlyMode || s.onlyMode === mode);
  const order = mode ? [...visible].sort((x, y) => (y.modes.includes(mode) - x.modes.includes(mode)) || (!!x.wide - !!y.wide)) : visible;
  // si quedan botones impares, el último chico ocupa todo el ancho (en el celu son 2 columnas)
  const small = order.filter(s => !s.wide);
  const lone = small.length % 2 ? small[small.length - 1] : null;
  document.getElementById("grid").innerHTML = order.map(s =>
    `<a class="big${mode && s.modes.includes(mode) ? " hl" : ""}${s.wide || s === lone ? " wide" : ""}" href="#${s.id}">
      <span class="ph" style="background-image:url('${s.img}')"><span class="ico">${s.ico}</span></span>
      <span class="lbl"><b>${esc(tr(s.title))}</b></span></a>`).join("");

  document.getElementById("sections").innerHTML = S.map(s => `
    <section class="section" id="${s.id}">
      <button class="back" onclick="location.hash=''">${tr(T.back)}</button>
      <div class="sec-ph" style="background-image:url('${s.img}')"></div>
      <h2>${s.ico} ${esc(tr(s.title))}</h2>
      <p class="intro">${esc(tr(s.intro))}</p>
      ${s.items.map(itemHTML).join("")}
      ${s.id === "info" && WHATSAPP ? `<a class="btn" href="https://wa.me/${WHATSAPP}" target="_blank" rel="noopener">${tr(T.wa)}</a>` : ""}
    </section>`).join("");
  route();
  if (document.getElementById("chat").classList.contains("on")) chatRepaint();
}

function route() {
  const id = location.hash.slice(1);
  const target = id && document.getElementById(id) && id !== "home" ? id : "home";
  document.querySelectorAll(".section").forEach(s => s.classList.toggle("on", s.id === target));
  window.scrollTo(0, 0);
}

document.querySelectorAll(".langs button").forEach(b => b.onclick = () => {
  lang = b.dataset.lang; try { localStorage.setItem("vm_lang", lang); } catch (e) {} render();
});
document.querySelectorAll(".mode button").forEach(b => b.onclick = () => {
  mode = b.dataset.mode; try { localStorage.setItem("vm_mode", mode); } catch (e) {} render();
});
window.addEventListener("hashchange", route);
const fab = document.getElementById("waFab");
if (WHATSAPP) fab.href = "https://wa.me/" + WHATSAPP; else fab.remove();

/* ===== Asistente con IA ===== */
let chatRepaint = () => {};
function initChat(url) {
  const box = document.getElementById("chat"), body = document.getElementById("chatBody");
  const form = document.getElementById("chatForm"), input = document.getElementById("chatInput");
  const send = document.getElementById("chatSend"), aiFab = document.getElementById("aiFab");
  document.getElementById("chatWa").href = "https://wa.me/" + WHATSAPP;
  let hist = [];
  try { hist = JSON.parse(sessionStorage.getItem("vm_chat") || "[]"); } catch (e) {}
  const save = () => { try { sessionStorage.setItem("vm_chat", JSON.stringify(hist)); } catch (e) {} };

  function bubble(text, cls) {
    const d = document.createElement("div");
    d.className = "msg " + cls; d.textContent = text;
    body.appendChild(d); body.scrollTop = body.scrollHeight;
    return d;
  }
  function paint() {
    body.innerHTML = "";
    bubble(tr(T.aiHello), "bot");
    hist.forEach(m => bubble(m.content, m.role === "user" ? "me" : "bot"));
    send.textContent = tr(T.aiSend); input.placeholder = tr(T.aiPh);
  }
  chatRepaint = paint;

  aiFab.hidden = false;
  aiFab.onclick = () => { paint(); box.classList.add("on"); aiFab.hidden = true; setTimeout(() => input.focus(), 50); };
  document.getElementById("chatClose").onclick = () => { box.classList.remove("on"); aiFab.hidden = false; };
  input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });

  form.onsubmit = async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = ""; send.disabled = true;
    hist.push({ role: "user", content: text }); save();
    bubble(text, "me");
    const typing = bubble(tr(T.aiTyping), "bot typing");
    try {
      // el servidor acepta hasta 30 mensajes y la charla tiene que empezar por el huésped
      let envio = hist.slice(-29);
      if (envio[0].role !== "user") envio = envio.slice(1);
      const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: envio }) });
      const data = await r.json();
      if (!r.ok || !data.reply) throw new Error(data.error || r.status);
      hist.push({ role: "assistant", content: data.reply }); save();
      typing.remove(); bubble(data.reply, "bot");
    } catch (err) {
      hist.pop(); save();
      typing.remove(); bubble(tr(T.aiErr), "bot");
    } finally { send.disabled = false; input.focus(); }
  };
}
if (ASISTENTE_URL) initChat(ASISTENTE_URL);
render();
</script>
